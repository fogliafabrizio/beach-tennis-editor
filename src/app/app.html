<main class="app-shell">
  <header class="app-shell__header">
    <h1>Beach Tennis Editor</h1>
    <app-import-button />
  </header>
  <section class="app-shell__body">
    <app-clip-list class="app-shell__sidebar" />
    <div class="app-shell__main">
      @if (isEmpty()) {
        <p class="app-shell__empty">Importa un video per iniziare.</p>
      } @else {
        <app-video-player class="app-shell__player" />
        <app-timeline class="app-shell__timeline" />
      }
    </div>
  </section>
</main>
