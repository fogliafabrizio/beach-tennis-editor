<aside class="clip-list" aria-label="Clip importate">
  <h2 class="clip-list__heading">Clip</h2>
  @if (isEmpty()) {
    <p class="clip-list__empty">Nessuna clip importata.</p>
  } @else {
    <ul class="clip-list__items">
      @for (clip of clips(); track clip.id) {
        <li class="clip-list__item">
          <span class="clip-list__name" [title]="clip.filePath">{{ label(clip.filePath) }}</span>
          <span class="clip-list__duration">{{ duration(clip) }}</span>
        </li>
      }
    </ul>
  }
</aside>
