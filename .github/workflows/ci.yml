name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # `npm install` invece di `npm ci`: il lockfile generato su Windows
      # non lista alcune optional cross-platform di `unrs-resolver`
      # (transitiva di ESLint) — note npm issue. Su CI Linux preferiamo
      # lasciar risolvere quelle binding piuttosto che fallire `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
